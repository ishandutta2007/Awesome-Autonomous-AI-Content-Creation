<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080e1a" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleGlow" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Text Linear Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>

    <!-- Dynamic Flow Lines Animations -->
    <style>
      @keyframes pulseBeam {
        0%, 100% { stroke-dashoffset: 0; opacity: 0.3; }
        50% { stroke-dashoffset: 120; opacity: 0.85; }
      }
      @keyframes floatOrb1 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(25px, -15px) scale(1.08); }
      }
      @keyframes floatOrb2 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(-30px, 20px) scale(1.1); }
      }
      @keyframes nodePulse {
        0%, 100% { transform: scale(1); opacity: 0.7; }
        50% { transform: scale(1.25); opacity: 1; }
      }
      .beam-path {
        stroke-dasharray: 20, 10;
        animation: pulseBeam 8s linear infinite;
      }
      .orb-1 {
        animation: floatOrb1 7s ease-in-out infinite;
      }
      .orb-2 {
        animation: floatOrb2 9s ease-in-out infinite;
      }
      .pulse-dot {
        transform-origin: center;
        animation: nodePulse 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Base Dark Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Glowing Ambience Orbs in Background -->
  <g class="orb-1">
    <circle cx="240" cy="140" r="280" fill="url(#cyanGlow)" />
  </g>
  <g class="orb-2">
    <circle cx="960" cy="260" r="300" fill="url(#purpleGlow)" />
  </g>

  <!-- Subtle High-Tech Blueprint Grid -->
  <rect width="1200" height="400" rx="16" fill="url(#techGrid)" />

  <!-- Dynamic Circuit / Pipeline Agent Flow Lines in Background -->
  <g stroke-linecap="round" fill="none">
    <!-- Stream 1 -->
    <path class="beam-path" d="M 50 100 Q 300 30, 600 90 T 1150 120" stroke="#0ea5e9" stroke-width="2" />
    <!-- Stream 2 -->
    <path class="beam-path" d="M 80 320 Q 400 370, 750 310 T 1120 280" stroke="#a855f7" stroke-width="2" style="animation-delay: -3s;" />
    <!-- Stream 3 Connectors -->
    <path class="beam-path" d="M 200 350 L 350 200 L 500 240 L 850 160 L 1050 220" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" style="animation-delay: -5s;" />
  </g>

  <!-- Interactive Network Nodes -->
  <circle cx="200" cy="350" r="4" fill="#38bdf8" class="pulse-dot" />
  <circle cx="350" cy="200" r="5" fill="#818cf8" class="pulse-dot" style="animation-delay: 1s;" />
  <circle cx="850" cy="160" r="4" fill="#c084fc" class="pulse-dot" style="animation-delay: 1.5s;" />
  <circle cx="1050" cy="220" r="5" fill="#38bdf8" class="pulse-dot" style="animation-delay: 2s;" />

  <!-- Border Frame -->
  <rect x="2" y="2" width="1196" height="396" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- FOREGROUND: Category Badges & Pills -->
  <g transform="translate(600, 70)" text-anchor="middle">
    <!-- Top Pill Container -->
    <rect x="-195" y="-18" width="390" height="36" rx="18" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" />
    <text x="0" y="5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">⚡ CURATED REPOSITORY &amp; DIRECTORY ⚡</text>
  </g>

  <!-- FOREGROUND: Main Title (Solid & Gradient, Unobstructed) -->
  <g transform="translate(600, 160)" text-anchor="middle">
    <text x="0" y="0" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      Awesome Autonomous AI Content Creation
    </text>
  </g>

  <!-- FOREGROUND: Subtitle -->
  <g transform="translate(600, 215)" text-anchor="middle">
    <text x="0" y="0" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" letter-spacing="0.2">
      Multi-Agent Pipelines • Local Agents • Autonomous SEO • Human-in-the-Loop Publishing
    </text>
  </g>

  <!-- FOREGROUND: Bottom Feature Badges / Highlights -->
  <g transform="translate(600, 290)" text-anchor="middle">
    <!-- Badge 1: Multi-Agent Workflows -->
    <g transform="translate(-320, 0)">
      <rect x="-100" y="-18" width="200" height="36" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.2" />
      <text x="0" y="5" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🤖 Multi-Agent Systems</text>
    </g>

    <!-- Badge 2: Autonomous SEO & Optimization -->
    <g transform="translate(-105, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="10" fill="#0f172a" stroke="#6366f1" stroke-width="1.2" />
      <text x="0" y="5" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📈 Autonomous SEO</text>
    </g>

    <!-- Badge 3: Deep Research Engines -->
    <g transform="translate(105, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2" />
      <text x="0" y="5" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🔍 Deep Research Agents</text>
    </g>

    <!-- Badge 4: Production Pipelines -->
    <g transform="translate(320, 0)">
      <rect x="-100" y="-18" width="200" height="36" rx="10" fill="#0f172a" stroke="#ec4899" stroke-width="1.2" />
      <text x="0" y="5" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🚀 Production Pipelines</text>
    </g>
  </g>

  <!-- Subtle Bottom Meta Tag -->
  <g transform="translate(600, 360)" text-anchor="middle">
    <text x="0" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
      Open-Source Infrastructure &amp; Enterprise SaaS Comparison • Star 🌟 to Support the Community
    </text>
  </g>
</svg>